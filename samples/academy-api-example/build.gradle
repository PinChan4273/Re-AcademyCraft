// Re:AcademyCraftの公開API（実験的）だけを使う、小さなサンプルのアドオン（Minecraft 26.2 / NeoForge）。本体とは別のビルドで、本体の
// リポジトリの直下から次のように作る（先に本体のJARを作っておく）:
//   bash gradlew jar
//   bash gradlew -p samples/academy-api-example build
// 本体のJARは、本体のbuild/libsから直接読む（APIはGitHub ReleasesのSDKで配り、Mavenの配布は無い）。
// 版は本体のgradle.propertiesと同じ（NeoForge・Parchment）。26.2は配布のJARも開発の名前のままなので、名前の変換の工程は無い。
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'io.github.pinchan4273.academyexample'
version = '0.1.0'
base { archivesName = 'academy-api-example-neoforge-26.2' }

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

// ソースはUTF-8（日本語のコメント）。OSの既定の文字コード（Windowsではwindows-31j）で読むと、コメントが化けて警告になり、環境で結果が変わりうる。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

neoForge {
    version = '26.2.0.93'
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }
    mods {
        academyexample { sourceSet(sourceSets.main) }
    }
}

repositories {
    // 本体のJAR（re-academycraft-neoforge-26.2-<版>.jar）を、本体のビルドの出力から読む。
    flatDir { dirs '../../build/libs' }
}

def academyVersion = project.findProperty('academyVersion') ?: '1.5.1'

dependencies {
    // 本体のJARに対してコンパイルする。サンプルのJARには入らない（配布では、本体のJARをmodsに置く）。
    // 開発用の起動（runClient・runServer）では、本体も一緒に読み込む。
    // -PacademyApiOnly を付けると、公開APIだけのJAR（本体のapiJar）に対してコンパイルする（APIの外を使っていないことの確かめ）。
    implementation "blank:re-academycraft-neoforge-26.2:${academyVersion}" + (project.hasProperty('academyApiOnly') ? ':api' : '')
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version': project.version }
}

// サンプルの新しい部分はGPLv3。JARにライセンスの全文と、サンプルの表示を入れる。
tasks.named('jar', Jar) {
    from('../../LICENSE')
    from('NOTICE.md')
}

// 本体と同じく、JARの中身の日時と順番を固定する（同じソースから同じバイトのJARを作る）。
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
