# Re:AcademyCraft — Minecraft 26.2 / NeoForge 版のビルドの設定。
# 版は公式MDK NeoForgeMDKs/MDK-26.2-ModDevGradle の固定値。
# Forge 1.20.1版から移植したもの（機能はForge 1.20.1版の公開版1.5.2と同じ。版と通信の版は下の mod_version の注記）。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false

minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.93
loader_version_range=[1,)

mod_id=academy
mod_name=Re:AcademyCraft
mod_license=GPLv3 with upstream additional terms; see LICENSE and META-INF/licenses
# NeoForge 26.2 版 1.5.2（Forge 1.20.1 版の公開版 1.5.2 と同じ仕様。NeoForge 1.21.1 版の 1.5.2 と同じ機能。通信の版は73）。
mod_version=1.5.2
mod_group_id=io.github.pinchan4273.reacademycraft
