name: Re:AcademyCraft 1.20.1 build
on:
  # 手動実行と、releaseのtag（例: 1.20.1-v1.0.0）で動く。tagのcommitから作ったJARを公開する。
  workflow_dispatch:
  push:
    tags:
      - '*-v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: ビルド（clean build）
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - name: SHA256SUMSを作る
        working-directory: build/libs
        run: |
          sha256sum re-academycraft-forge-1.20.1-*.jar > SHA256SUMS
          cat SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: re-academycraft-forge-1.20.1
          if-no-files-found: error
          path: |
            build/libs/re-academycraft-forge-1.20.1-*.jar
            build/libs/SHA256SUMS
